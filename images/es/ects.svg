<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Créditos y carga de trabajo</title><desc id="desc">Un crédito ECTS no equivale a una hora de clase ni a una nota.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Créditos y carga de trabajo</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Un crédito ECTS no equivale a una hora de clase ni a una nota.</text><rect x="64" y="264" width="1072" height="150" rx="24" fill="#071a2c" stroke="#071a2c"/><text x="100" y="320" font-size="19" fill="#c3ddd4" font-weight="700" text-anchor="start">EJEMPLO EN EL MARCO ESPAÑOL</text><text x="100" y="380" font-size="47" fill="#fff" font-weight="700" text-anchor="start">6 ECTS × 25–30 h = 150–180 h</text><rect x="64" y="450" width="508" height="215" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="107" cy="502" r="23" fill="#e8f3ee"/><text x="107" y="511" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">A</text><text x="92" y="563" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Docencia</text><text x="92" y="614" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Clases y actividades.</text><text x="92" y="652" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Solo una parte del total.</text><rect x="628" y="450" width="508" height="215" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="671" cy="502" r="23" fill="#e8f3ee"/><text x="671" y="511" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">B</text><text x="656" y="563" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Trabajo autónomo</text><text x="656" y="614" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Lectura y preparación.</text><text x="656" y="652" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Proyectos y evaluación.</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Diagrama original de AspireCompass · Ejemplo educativo</text></g></svg>