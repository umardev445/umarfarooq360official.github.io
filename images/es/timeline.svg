<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Planifica tareas y dependencias</title><desc id="desc">Un cronograma se ajusta al alcance, la disponibilidad y las revisiones.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Planifica tareas y dependencias</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Un cronograma se ajusta al alcance, la disponibilidad y las revisiones.</text><rect x="64" y="260" width="1072" height="390" rx="24" fill="#fff" stroke="#ccdcd5"/><text x="96" y="309" font-size="19" fill="#147965" font-weight="700" text-anchor="start">PLAN ILUSTRATIVO DE 12 SEMANAS</text><text x="374" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">1</text><path d="M374 366L374 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="435" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">2</text><path d="M435 366L435 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="496" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">3</text><path d="M496 366L496 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="557" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">4</text><path d="M557 366L557 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="618" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">5</text><path d="M618 366L618 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="679" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">6</text><path d="M679 366L679 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="740" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">7</text><path d="M740 366L740 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="801" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">8</text><path d="M801 366L801 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="862" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">9</text><path d="M862 366L862 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="923" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">10</text><path d="M923 366L923 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="984" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">11</text><path d="M984 366L984 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="1045" y="350" font-size="17" fill="#49606b" font-weight="500" text-anchor="middle">12</text><path d="M1045 366L1045 617" stroke="#e5ede9" stroke-width="1" fill="none"/><text x="96" y="408" font-size="25" fill="#071a2c" font-weight="650" text-anchor="start">Delimitar</text><rect x="346" y="384" width="114" height="29" rx="9" fill="#147965" stroke="#147965"/><text x="96" y="468" font-size="25" fill="#071a2c" font-weight="650" text-anchor="start">Investigar</text><rect x="407" y="444" width="297" height="29" rx="9" fill="#147965" stroke="#147965"/><text x="96" y="528" font-size="25" fill="#071a2c" font-weight="650" text-anchor="start">Redactar</text><rect x="590" y="504" width="358" height="29" rx="9" fill="#071a2c" stroke="#071a2c"/><text x="96" y="588" font-size="25" fill="#071a2c" font-weight="650" text-anchor="start">Revisar</text><rect x="834" y="564" width="236" height="29" rx="9" fill="#ad7d17" stroke="#ad7d17"/><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Ejemplo didáctico · Las semanas no constituyen un plazo institucional</text></g></svg>