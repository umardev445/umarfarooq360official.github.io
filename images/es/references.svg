<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">De la obra a la referencia</title><desc id="desc">Comprueba los metadatos en la fuente que has leído.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">De la obra a la referencia</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Comprueba los metadatos en la fuente que has leído.</text><rect x="64" y="267" width="1072" height="330" rx="24" fill="#fff" stroke="#ccdcd5"/><text x="96" y="316" font-size="20" fill="#147965" font-weight="700" text-anchor="start">UNA REFERENCIA NECESITA DATOS COMPROBADOS</text><text x="96" y="369" font-size="26" fill="#071a2c" font-weight="700" text-anchor="start">Autor</text><text x="330" y="369" font-size="25" fill="#49606b" font-weight="500" text-anchor="start">¿Quién creó la obra?</text><path d="M96 387L1104 387" stroke="#e1e9e5" stroke-width="1" fill="none"/><text x="96" y="426" font-size="26" fill="#071a2c" font-weight="700" text-anchor="start">Fecha</text><text x="330" y="426" font-size="25" fill="#49606b" font-weight="500" text-anchor="start">¿Cuándo se publicó?</text><path d="M96 444L1104 444" stroke="#e1e9e5" stroke-width="1" fill="none"/><text x="96" y="483" font-size="26" fill="#071a2c" font-weight="700" text-anchor="start">Título</text><text x="330" y="483" font-size="25" fill="#49606b" font-weight="500" text-anchor="start">¿Qué obra consultaste?</text><path d="M96 501L1104 501" stroke="#e1e9e5" stroke-width="1" fill="none"/><text x="96" y="540" font-size="26" fill="#071a2c" font-weight="700" text-anchor="start">Fuente</text><text x="330" y="540" font-size="25" fill="#49606b" font-weight="500" text-anchor="start">¿Dónde se encuentra?</text><path d="M96 558L1104 558" stroke="#e1e9e5" stroke-width="1" fill="none"/><text x="64" y="654" font-size="26" fill="#147965" font-weight="600" text-anchor="start">La referencia y la cita en el texto cumplen funciones diferentes.</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Diagrama original de AspireCompass · Ejemplo educativo</text></g></svg>