<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Una tarea. Un bloque. Una revisión.</title><desc id="desc">Separa el tiempo previsto del trabajo que realmente terminas.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Una tarea. Un bloque. Una revisión.</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Separa el tiempo previsto del trabajo que realmente terminas.</text><rect x="64" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="107" cy="332" r="23" fill="#e8f3ee"/><text x="107" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">1</text><text x="92" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Elige una tarea</text><text x="92" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Un resultado concreto.</text><text x="92" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Tamaño manejable.</text><text x="92" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Material preparado.</text><rect x="448" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="491" cy="332" r="23" fill="#e8f3ee"/><text x="491" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">2</text><text x="476" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Trabaja el bloque</text><text x="476" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Protege la atención.</text><text x="476" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Anota interrupciones.</text><text x="476" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Haz una pausa.</text><rect x="832" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="875" cy="332" r="23" fill="#e8f3ee"/><text x="875" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">3</text><text x="860" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Revisa el avance</text><text x="860" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">¿Qué has terminado?</text><text x="860" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">¿Qué sigue pendiente?</text><text x="860" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Ajusta el próximo plan.</text><text x="64" y="647" font-size="25" fill="#147965" font-weight="600" text-anchor="start">El temporizador ayuda a organizarte; no garantiza una nota.</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Diagrama original de AspireCompass · Ejemplo educativo</text></g></svg>