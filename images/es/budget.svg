<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Gasto y liquidez se calculan aparte</title><desc id="desc">Ejemplo ficticio: sustituye todos los importes por cotizaciones de tu caso.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Gasto y liquidez se calculan aparte</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Ejemplo ficticio: sustituye todos los importes por cotizaciones de tu caso.</text><rect x="64" y="262" width="1072" height="245" rx="24" fill="#fff" stroke="#ccdcd5"/><text x="98" y="317" font-size="28" fill="#071a2c" font-weight="500" text-anchor="start">Matrícula y tasas</text><text x="1095" y="317" font-size="31" fill="#071a2c" font-weight="700" text-anchor="end">2.400 €</text><text x="98" y="384" font-size="28" fill="#071a2c" font-weight="500" text-anchor="start">Vida: 850 € × 10 meses</text><text x="1095" y="384" font-size="31" fill="#071a2c" font-weight="700" text-anchor="end">8.500 €</text><text x="98" y="451" font-size="28" fill="#071a2c" font-weight="500" text-anchor="start">Gastos iniciales</text><text x="1095" y="451" font-size="31" fill="#071a2c" font-weight="700" text-anchor="end">600 €</text><rect x="64" y="536" width="508" height="127" rx="24" fill="#071a2c" stroke="#071a2c"/><text x="94" y="582" font-size="18" fill="#cfdfd9" font-weight="700" text-anchor="start">GASTO PREVISTO</text><text x="94" y="635" font-size="43" fill="#fff" font-weight="700" text-anchor="start">11.500 €</text><rect x="596" y="536" width="540" height="127" rx="24" fill="#e8f3ee" stroke="#ccdcd5"/><text x="626" y="579" font-size="18" fill="#147965" font-weight="700" text-anchor="start">CON FIANZA DE 800 €</text><text x="626" y="631" font-size="35" fill="#071a2c" font-weight="700" text-anchor="start">Liquidez: 12.300 €</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Ejemplo didáctico · No es un precio nacional ni una cuantía de visado</text></g></svg>