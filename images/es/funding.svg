<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Una beca no resuelve todo el calendario</title><desc id="desc">Comprueba elegibilidad, cobertura, estado y momento de pago.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Una beca no resuelve todo el calendario</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Comprueba elegibilidad, cobertura, estado y momento de pago.</text><rect x="64" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="107" cy="332" r="23" fill="#e8f3ee"/><text x="107" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">1</text><text x="92" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Admisión</text><text x="92" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Programa adecuado.</text><text x="92" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Acceso confirmado.</text><text x="92" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Candidatura completa.</text><rect x="448" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="491" cy="332" r="23" fill="#e8f3ee"/><text x="491" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">2</text><text x="476" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Ayuda</text><text x="476" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Convocatoria concreta.</text><text x="476" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Gastos cubiertos.</text><text x="476" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Concesión o solicitud.</text><rect x="832" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="875" cy="332" r="23" fill="#e8f3ee"/><text x="875" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">3</text><text x="860" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Liquidez</text><text x="860" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Cuándo se cobra.</text><text x="860" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Pagos anteriores.</text><text x="860" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Importe pendiente.</text><text x="64" y="647" font-size="25" fill="#147965" font-weight="600" text-anchor="start">Pendiente de resolución no equivale a financiación disponible.</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Diagrama original de AspireCompass · Ejemplo educativo</text></g></svg>