<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Tres comprobaciones distintas</title><desc id="desc">La acreditación, la selección y la matrícula tienen sus propias condiciones.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Tres comprobaciones distintas</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">La acreditación, la selección y la matrícula tienen sus propias condiciones.</text><rect x="64" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="107" cy="332" r="23" fill="#e8f3ee"/><text x="107" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">1</text><text x="92" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Acceso</text><text x="92" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Estudios previos.</text><text x="92" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Vía y acreditación.</text><text x="92" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Documentos exigidos.</text><rect x="448" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="491" cy="332" r="23" fill="#e8f3ee"/><text x="491" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">2</text><text x="476" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Admisión</text><text x="476" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Programa y curso.</text><text x="476" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Criterios y plazas.</text><text x="476" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Plazos y selección.</text><rect x="832" y="280" width="304" height="300" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="875" cy="332" r="23" fill="#e8f3ee"/><text x="875" y="341" font-size="25" fill="#147965" font-weight="700" text-anchor="middle">3</text><text x="860" y="393" font-size="27" fill="#071a2c" font-weight="700" text-anchor="start">Matrícula</text><text x="860" y="444" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Oferta confirmada.</text><text x="860" y="482" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Precio aplicable.</text><text x="860" y="520" font-size="22" fill="#49606b" font-weight="500" text-anchor="start">Condiciones y pago.</text><text x="64" y="648" font-size="27" fill="#147965" font-weight="600" text-anchor="start">Confirma cada etapa con la institución que decide.</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Diagrama original de AspireCompass · Ejemplo educativo</text></g></svg>