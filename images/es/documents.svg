<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Cada documento tiene una función</title><desc id="desc">Expediente, reconocimiento, apostilla y traducción no son intercambiables.</desc><rect width="1200" height="800" rx="32" fill="#f0f5f2"/><g font-family="Arial, Helvetica, sans-serif"><rect x="56" y="44" width="244" height="38" rx="19" fill="#071a2c" stroke="#071a2c"/><text x="178" y="70" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">ASPIRECOMPASS</text><text x="64" y="156" font-size="44" fill="#071a2c" font-weight="750" text-anchor="start">Cada documento tiene una función</text><text x="64" y="204" font-size="23" fill="#49606b" font-weight="500" text-anchor="start">Expediente, reconocimiento, apostilla y traducción no son intercambiables.</text><rect x="64" y="261" width="1072" height="396" rx="24" fill="#fff" stroke="#ccdcd5"/><circle cx="111" cy="317" r="23" fill="#e8f3ee"/><text x="111" y="325" font-size="24" fill="#147965" font-weight="700" text-anchor="middle">1</text><text x="157" y="324" font-size="30" fill="#071a2c" font-weight="600" text-anchor="start">Identifica quién emite el documento.</text><circle cx="111" cy="405" r="23" fill="#e8f3ee"/><text x="111" y="413" font-size="24" fill="#147965" font-weight="700" text-anchor="middle">2</text><text x="157" y="412" font-size="30" fill="#071a2c" font-weight="600" text-anchor="start">Comprueba qué pide el destinatario.</text><circle cx="111" cy="493" r="23" fill="#e8f3ee"/><text x="111" y="501" font-size="24" fill="#147965" font-weight="700" text-anchor="middle">3</text><text x="157" y="500" font-size="30" fill="#071a2c" font-weight="600" text-anchor="start">Confirma autenticación y traducción.</text><circle cx="111" cy="581" r="23" fill="#e8f3ee"/><text x="111" y="589" font-size="24" fill="#147965" font-weight="700" text-anchor="middle">4</text><text x="157" y="588" font-size="30" fill="#071a2c" font-weight="600" text-anchor="start">Revisa formato, plazo y justificante.</text><path d="M64 716L1136 716" stroke="#ccdad4" stroke-width="2" fill="none"/><text x="64" y="755" font-size="19" fill="#49606b" font-weight="500" text-anchor="start">Diagrama original de AspireCompass · Ejemplo educativo</text></g></svg>