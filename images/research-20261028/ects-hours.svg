<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420"><title>Ejemplo de conversión ECTS a horas</title><desc>Seis ECTS por veinticinco horas por crédito son ciento cincuenta horas; en veinte semanas son siete horas y media semanales.</desc><rect width="1100" height="420" rx="24" fill="#f3f5ec"/><g font-family="system-ui,sans-serif" fill="#173f32"><text x="50" y="70" font-size="24" font-weight="700">DE CRÉDITOS A CARGA DE TRABAJO</text><rect x="48" y="108" width="285" height="170" rx="18" fill="#e1ece0"/><rect x="407" y="108" width="285" height="170" rx="18" fill="#e1ece0"/><rect x="766" y="108" width="285" height="170" rx="18" fill="#1e5740"/><text x="190" y="173" text-anchor="middle" font-size="38" font-weight="700">6 × 25</text><text x="190" y="221" text-anchor="middle" font-size="22">ECTS × horas/ECTS</text><text x="369" y="198" text-anchor="middle" font-size="38">=</text><text x="549" y="173" text-anchor="middle" font-size="38" font-weight="700">150 horas</text><text x="549" y="221" text-anchor="middle" font-size="22">trabajo total</text><text x="728" y="198" text-anchor="middle" font-size="32">→</text><text x="908" y="173" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">7,5 h/sem.</text><text x="908" y="221" text-anchor="middle" font-size="22" fill="#fff">150 ÷ 20 semanas</text><text x="50" y="335" font-size="23">Ejemplo editable: utiliza el factor y el calendario de tu plan.</text><text x="50" y="378" font-size="21">Las horas totales incluyen estudio, actividades y evaluación.</text></g></svg>
