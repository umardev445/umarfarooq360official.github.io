<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420"><title>Proceso para comprobar un estudio en el RUCT</title><desc>Copiar los datos del título, consultar el acceso oficial y contrastar código, universidad, centro y estado.</desc><rect width="1100" height="420" rx="24" fill="#f3f5ec"/><g font-family="system-ui,sans-serif" fill="#173f32"><text x="48" y="70" font-size="26" font-weight="700">COMPRUEBA EL ESTUDIO, PASO A PASO</text><rect x="48" y="110" width="305" height="185" rx="18" fill="#e1ece0"/><rect x="397" y="110" width="305" height="185" rx="18" fill="#e1ece0"/><rect x="746" y="110" width="305" height="185" rx="18" fill="#e1ece0"/><text x="72" y="160" font-size="27" font-weight="700">1. Copia los datos</text><text x="72" y="211" font-size="23">Nombre oficial</text><text x="72" y="253" font-size="23">Universidad y código</text><text x="373" y="210" text-anchor="middle" font-size="27">→</text><text x="421" y="160" font-size="27" font-weight="700">2. Consulta el RUCT</text><text x="421" y="211" font-size="23">Acceso del Ministerio</text><text x="421" y="253" font-size="23">Registro del estudio</text><text x="723" y="210" text-anchor="middle" font-size="27">→</text><text x="770" y="160" font-size="27" font-weight="700">3. Contrasta la ficha</text><text x="770" y="211" font-size="23">Código, centro, estado</text><text x="770" y="253" font-size="23">Oferta actual</text><text x="48" y="350" font-size="23">Sin resultados: revisa los datos y solicita la referencia exacta.</text><text x="48" y="390" font-size="20">Esquema propio; no representa una captura ni un servicio del Ministerio.</text></g></svg>
